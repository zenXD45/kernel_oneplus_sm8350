name: Build OnePlus Kernel with ReSukiSU

# 1. TRIGER: When does this run?
# This tells GitHub to run this script whenever you push code to the "sixteen" branch,
# or when you manually click the "Run workflow" button in the Actions tab.
on:
  push:
    branches:
      - sixteen
  workflow_dispatch:
  # Run automatically every day at midnight (UTC) to catch new ReSukiSU updates
  schedule:
    - cron: "0 0 * * *"

# Ensure the workflow has permission to create GitHub Releases
permissions:
  contents: write

jobs:
  build:
    name: Build Kernel
    # 2. ENVIRONMENT: What kind of computer does this run on?
    # We use the Ubuntu 22.04 Linux server provided by GitHub for free.
    runs-on: ubuntu-22.04

    steps:
      # 3. GET THE CODE: Download your kernel source code to the GitHub server
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # This ensures it downloads the ReSukiSU submodule too!
          fetch-depth: 0

      # 3.5. AUTO-UPDATE RESUKISU: Fetch the absolute latest ReSukiSU from GitHub
      - name: Auto-Update ReSukiSU
        run: |
          git submodule update --remote KernelSU

      # 4. INSTALL DEPENDENCIES: Install the tools needed to compile a Linux kernel
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev curl wget cpio zstd

      # 5. GET THE COMPILER: Download the exact Clang toolchain you use locally
      - name: Setup Clang Toolchain
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          # Downloading a highly optimized Clang toolchain commonly used for Android kernels (Proton Clang)
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .

      # 6. COMPILE THE KERNEL: This perfectly mirrors your local build_kernel.sh
      - name: Compile Kernel
        run: |
          # Set up environment variables so the system knows where the compiler is
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          export OPTIMIZATION_FLAGS="-O2 -march=armv8.2-a -mtune=cortex-a78 -fno-strict-aliasing -mllvm -inline-threshold=325"

          # Clean the workspace
          make ARCH=arm64 O=out clean
          make ARCH=arm64 O=out mrproper
          
          # Merge your configs
          make ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-qgki_defconfig vendor/oplus_yupik_QGKI.config
          make ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # Build it using all available CPU cores on the GitHub server!
          make -j$(nproc) ARCH=arm64 O=out CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="$OPTIMIZATION_FLAGS" EXTRA_CFLAGS="$OPTIMIZATION_FLAGS" Image

      # 7. PACKAGE ANYKERNEL3: Create a flashable zip for Realme 9 5G SE / Q3s
      - name: Package AnyKernel3 Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md
          
          # Create our custom anykernel.sh configuration for Realme Q3s / 9 5G SE
          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers
          
          properties() { '
          kernel.string=Custom Kernel for Realme 9 5G SE / Q3s
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=RMX3461
          device.name2=RE54B4L1
          device.name3=lemonx
          device.name4=lemon7
          device.name5=
          supported.versions=
          supported.patchlevels=
          '; }
          
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=auto;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          
          . tools/ak3-core.sh;
          
          dump_boot;
          write_boot;
          EOF
          
          # Copy the compiled kernel image (the workflow already outputs to out/arch/arm64/boot/Image)
          cp ../out/arch/arm64/boot/Image .
          
          # Ensure the kernel image isn't corrupted (do not strip)
          # Use unmodified update-binary for wider recovery compatibility
          
          # Create the flashable zip (without apksigner to avoid CI/CD errors)
          zip -r9 ../AnyKernel3-Realme-9-5G-SE-Q3s.zip *
          
          cd ..

      # 8. UPLOAD THE RESULT: Save the AnyKernel3 flashable zip so you can download it
      - name: Upload AnyKernel3 Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-Realme-9-5G-SE-Q3s-ReSukiSU
          path: AnyKernel3-Realme-9-5G-SE-Q3s.zip

      - name: Upload Raw Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Image-Realme-9-5G-SE-Q3s-ReSukiSU
          path: out/arch/arm64/boot/Image

      # 9. PUBLISH TO RELEASES: Put the zip on the GitHub Releases page
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.run_number }}"
          name: "Automated Kernel Build (Run ${{ github.run_number }})"
          files: |
            AnyKernel3-Realme-9-5G-SE-Q3s.zip
            out/arch/arm64/boot/Image
          body: |
            Automated ReSukiSU Kernel Build for Realme 9 5G SE / Realme Q3s
            
            **How to install:**
            - **Rooted Users (No Custom Recovery needed):** Open the KernelSU / ReSukiSU manager app, go to the Modules tab, and select "Install from storage". Choose the `AnyKernel3-Realme-9-5G-SE-Q3s.zip` file.
            - **Custom Recovery:** Flash the `AnyKernel3-Realme-9-5G-SE-Q3s.zip` in TWRP or OrangeFox.
            - **Other Apps:** Flash using KernelFlasher or Franco Kernel Manager (FKM).
            - **Advanced:** Use the raw `Image` to manually patch and flash via fastboot.
            
            *(Note: You **cannot** install the zip via `adb sideload` in Stock Recovery, as stock recoveries strictly block unsigned custom zips.)*
